version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/Evals/marginbench"
    schedule:
      interval: monthly
    groups:
      marginbench-python:
        patterns: ["*"]
