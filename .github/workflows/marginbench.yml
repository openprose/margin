name: MarginBench

on:
  push:
    paths:
      - ".github/workflows/marginbench.yml"
      - "Package.swift"
      - "Sources/MarginCore/**"
      - "Sources/MarginCLI/**"
      - "Tests/MarginCoreTests/**"
      - "Tests/MarginCLITests/**"
      - "Evals/marginbench/**"
      - "Scripts/build-marginbench-linux.sh"
      - "Scripts/package-marginbench.sh"
      - "Scripts/test-linux.sh"
  pull_request:
    paths:
      - ".github/workflows/marginbench.yml"
      - "Package.swift"
      - "Sources/MarginCore/**"
      - "Sources/MarginCLI/**"
      - "Tests/MarginCoreTests/**"
      - "Tests/MarginCLITests/**"
      - "Evals/marginbench/**"
      - "Scripts/build-marginbench-linux.sh"
      - "Scripts/package-marginbench.sh"
      - "Scripts/test-linux.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marginbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-gate:
    name: Portable core, benchmark, and Prime adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MARGINBENCH_ROOT: ${{ github.workspace }}/Evals/marginbench
      MARGINBENCH_BINARY: ${{ github.workspace }}/Evals/marginbench/marginbench/bin/margin-linux-x86_64

    steps:
      - name: Check out the frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq libdigest-sha-perl unzip zsh
          python -m pip install --disable-pip-version-check uv==0.7.8 "httpx>=0.27,<1" "jsonschema>=4.23,<5"
          uv tool install --with "jsonschema>=4.23,<5" prime==0.6.24
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run every portable Swift contract in pinned Linux
        run: zsh Scripts/test-linux.sh

      - name: Rebuild and verify the published x86-64 executable
        run: |
          zsh Scripts/build-marginbench-linux.sh amd64
          expected_sha="$(jq -er '.artifacts[] | select(.architecture == "x86_64") | .sha256' Evals/marginbench/BINARY_MANIFEST.json)"
          expected_bytes="$(jq -er '.artifacts[] | select(.architecture == "x86_64") | .bytes' Evals/marginbench/BINARY_MANIFEST.json)"
          actual_sha="$(shasum -a 256 "$MARGINBENCH_BINARY" | awk '{print $1}')"
          actual_bytes="$(stat -c '%s' "$MARGINBENCH_BINARY")"
          test "$actual_sha" = "$expected_sha"
          test "$actual_bytes" = "$expected_bytes"
          "$MARGINBENCH_BINARY" version

      - name: Run provider-independent contracts and exact reference cases
        run: |
          PYTHONPATH="$MARGINBENCH_ROOT" python -m unittest discover \
            -s "$MARGINBENCH_ROOT/tests" -p 'test_*.py'
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli self-test \
            --margin-bin "$MARGINBENCH_BINARY"
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli neutral-feasibility
          for bundle in "$MARGINBENCH_ROOT"/results/crossover/v*; do
            PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli audit-crossover \
              "$bundle"
          done

      - name: Run the Prime Verifiers contracts and no-model rehearsal
        run: |
          PYTHONPATH="$MARGINBENCH_ROOT" \
            "$HOME/.local/share/uv/tools/prime/bin/python" -m unittest discover \
            -s "$MARGINBENCH_ROOT/tests" -p 'test_*.py'
          PYTHONPATH="$MARGINBENCH_ROOT" "$MARGINBENCH_ROOT/preflight.py" \
            --margin-bin "$MARGINBENCH_BINARY"
          PYTHONPATH="$MARGINBENCH_ROOT" "$MARGINBENCH_ROOT/preflight.py" \
            --margin-bin "$MARGINBENCH_BINARY" --server
          PYTHONPATH="$MARGINBENCH_ROOT" "$MARGINBENCH_ROOT/preflight.py" \
            --margin-bin "$MARGINBENCH_BINARY" \
            --control-profile single-agent-margin-v1
          PYTHONPATH="$MARGINBENCH_ROOT" "$MARGINBENCH_ROOT/preflight.py" \
            --margin-bin "$MARGINBENCH_BINARY" --server \
            --control-profile single-agent-margin-v1
          mkdir -p build/ci-marginbench-dist
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli \
            neutral-prompt-audit \
            > build/ci-marginbench-dist/neutral-prompt-audit.json
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli validate \
            build/ci-marginbench-dist/neutral-prompt-audit.json > /dev/null
          PYTHONPATH="$MARGINBENCH_ROOT" \
            "$HOME/.local/share/uv/tools/prime/bin/python" -m marginbench.cli \
            neutral-served-preflight \
            > build/ci-marginbench-dist/neutral-served-preflight.json
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli validate \
            build/ci-marginbench-dist/neutral-served-preflight.json > /dev/null
          PYTHONPATH="$MARGINBENCH_ROOT" \
            "$HOME/.local/share/uv/tools/prime/bin/python" -m marginbench.cli \
            neutral-isolation-preflight \
            > build/ci-marginbench-dist/neutral-isolation-preflight.json
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli validate \
            build/ci-marginbench-dist/neutral-isolation-preflight.json > /dev/null
          PYTHONPATH="$MARGINBENCH_ROOT" \
            "$HOME/.local/share/uv/tools/prime/bin/python" -m marginbench.cli \
            neutral-production-preflight \
            > build/ci-marginbench-dist/neutral-production-preflight.json
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli validate \
            build/ci-marginbench-dist/neutral-production-preflight.json > /dev/null
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli efficiency-report \
            build/ci-marginbench-dist/neutral-served-preflight.json \
            "$MARGINBENCH_ROOT/results/crossover/v17/cells/0001-parallel-shards-role-5cdfb0a164.run.json" \
            "$MARGINBENCH_ROOT/results/crossover/v17/cells/0002-parallel-shards-continuing-422c21b182.run.json" \
            > build/ci-marginbench-dist/efficiency-report.json
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli validate \
            build/ci-marginbench-dist/efficiency-report.json > /dev/null
          mkdir -p build/ci-marginbench-private
          cleanup_private_key() {
            if [ -f build/ci-marginbench-private/holdout.key ]; then
              dd if=/dev/urandom of=build/ci-marginbench-private/holdout.key \
                bs=65 count=1 conv=notrunc status=none
              unlink build/ci-marginbench-private/holdout.key
            fi
          }
          trap cleanup_private_key EXIT
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli keygen \
            build/ci-marginbench-private/holdout.key > /dev/null
          PYTHONPATH="$MARGINBENCH_ROOT" "$MARGINBENCH_ROOT/preflight.py" \
            --margin-bin "$MARGINBENCH_BINARY" --server \
            --holdout-key-file build/ci-marginbench-private/holdout.key
          PYTHONPATH="$MARGINBENCH_ROOT" "$MARGINBENCH_ROOT/preflight.py" \
            --margin-bin "$MARGINBENCH_BINARY" --server \
            --control-profile single-agent-margin-v1 \
            --holdout-key-file build/ci-marginbench-private/holdout.key
          cleanup_private_key
          trap - EXIT

      - name: Build and exercise the distributable wheel
        run: |
          uv build "$MARGINBENCH_ROOT" --out-dir build/ci-marginbench-dist
          wheel="$(find build/ci-marginbench-dist -type f -name '*.whl' -print -quit)"
          source_archive="$(find build/ci-marginbench-dist -type f -name '*.tar.gz' -print -quit)"
          sensitive_pattern='(^|/)(runs|keys|transcripts|raw-prompts|tmp|__pycache__|\.ruff_cache)(/|$)|(^|/)\.env($|\.)|\.(key|secret)($|\.)'
          if unzip -Z1 "$wheel" | grep -Eq "$sensitive_pattern"; then
            echo "Wheel contains a sensitive or generated path." >&2
            exit 1
          fi
          if tar -tzf "$source_archive" | grep -Eq "$sensitive_pattern"; then
            echo "Source archive contains a sensitive or generated path." >&2
            exit 1
          fi
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/build/ci-marginbench-dist:/dist:ro" \
            -e MARGINBENCH_WHEEL="/dist/$(basename "$wheel")" \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python@sha256:0f16c5d35fe6464ee471792ab3bb9116f911b65b3fbf10120c98d2bdc6332f48 \
            bash -lc '
              set -euo pipefail
              python -m pip install --quiet --no-cache-dir "httpx>=0.27,<1" "jsonschema>=4.23,<5"
              python -m pip install --quiet --no-cache-dir --no-deps "$MARGINBENCH_WHEEL"
              marginbench self-test
            '
          PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli validate \
            "$MARGINBENCH_ROOT/results/EXPERIMENT_LEDGER.json" \
            > build/ci-marginbench-dist/validation-receipt.json
          for bundle in "$MARGINBENCH_ROOT"/results/crossover/v*; do
            version="$(basename "$bundle")"
            PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli audit-crossover \
              "$bundle" > "build/ci-marginbench-dist/crossover-$version-audit.json"
            PYTHONPATH="$MARGINBENCH_ROOT" python -m marginbench.cli validate \
              "build/ci-marginbench-dist/crossover-$version-audit.json" > /dev/null
          done

      - name: Retain the checked package and validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marginbench-linux-x86_64-${{ github.sha }}
          path: build/ci-marginbench-dist/
          if-no-files-found: error
          retention-days: 7
